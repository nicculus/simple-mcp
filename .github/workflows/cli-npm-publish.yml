name: Publish cli/npm to npm

on:
  push:
    tags:
      - "cli-npm-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli/npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#cli-npm-v}"
          if [ -z "$VERSION" ]; then
            echo "Could not extract a version from tag '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          npm pkg set version="$VERSION"

      - run: npm ci

      - name: Smoke test
        run: node bin/simple-mcp.js --help

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
