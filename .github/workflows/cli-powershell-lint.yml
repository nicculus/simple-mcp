name: CLI PowerShell Lint

on:
  push:
    branches: [main]
    paths:
      - "cli/powershell/**"
      - ".github/workflows/cli-powershell-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/powershell/**"
      - ".github/workflows/cli-powershell-lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path cli/powershell -Recurse -Severity Warning,Error
          $results | Format-Table -AutoSize
          if ($results | Where-Object { $_.Severity -eq "Error" }) {
            throw "PSScriptAnalyzer found errors"
          }
