name: Publish cli/python to PyPI

on:
  push:
    tags:
      - "cli-python-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: cli/python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#cli-python-v}"
          if [ -z "$VERSION" ]; then
            echo "Could not extract a version from tag '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/python/dist
