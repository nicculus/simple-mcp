name: CLI Python Test

on:
  push:
    branches: [main]
    paths:
      - "cli/python/**"
      - ".github/workflows/cli-python-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/python/**"
      - ".github/workflows/cli-python-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Smoke test
        run: simple-mcp --help
