name: Publish client/js to npm

on:
  push:
    tags:
      - "client-js-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client/js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#client-js-v}"
          if [ -z "$VERSION" ]; then
            echo "Could not extract a version from tag '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          npm pkg set version="$VERSION"

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
