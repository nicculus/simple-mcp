name: Client JS Test

on:
  push:
    branches: [main]
    paths:
      - "client/js/**"
      - ".github/workflows/client-js-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/js/**"
      - ".github/workflows/client-js-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/js/package-lock.json
      - run: npm ci
      - run: npm test
