[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mcp-client-python"
dynamic = ["version"]
description = "Python client library and CLI for connecting to a serverless MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Held at mcp 1.x deliberately. mcp 2.x implements the 2026-07-28
    # stateless spec and renames the transport entrypoint
    # (streamablehttp_client -> streamable_http_client, headers= replaced by
    # an httpx2 client, 3-tuple yield -> 2-tuple). The server side can't
    # speak 2026-07-28 yet, so bumping this alone would only diverge the
    # clients. See docs/mcp-2026-07-28-migration.md.
    "mcp>=1.0,<2.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
mcp-client = "mcp_client.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# pyproject.toml lives two levels below the monorepo's git root (client/python -> client -> root).
root = "../.."
# Without these, git-describe matches ANY tag containing a digit — including
# cli-python-v*, cli-npm-v*, client-js-v*, infra tags — and derives this
# package's version from whichever one is most recent, not necessarily a
# client-python-v* tag.
tag_regex = "^client-python-v(?P<version>.+)$"
git_describe_command = "git describe --dirty --tags --long --match client-python-v*"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_client"]
